# Pull request into main  -> tests + web bundle (no deploy)
# Merge / push to main     -> tests + web bundle + Android APK + deploy to Azure App Service podavo-voyage
#                             (the APK is served at https://<app>/download/voyage.apk for the "Install app" button on Android)
# Same setup as the Podavo cleaning app (qubexon-pl/tidy, .github/workflows/deploy.yml).
name: Build and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  # Azure sign-in through GitHub OIDC (no passwords stored). These IDs are not secrets.
  AZURE_CLIENT_ID: "e225e254-7176-4481-82cb-ad0a064dc082"   # appId of the "github-tidy-deploy" app registration, also trusted for this repo's main
  AZURE_TENANT_ID: "77f4d6ee-95d6-499c-bdfc-786d81583d02"
  AZURE_SUBSCRIPTION_ID: "c4152d35-836b-4d38-ba59-b2587100043c"
  AZURE_RESOURCE_GROUP: "rg-komunikacja-plc"
  AZURE_WEBAPP_NAME: "podavo-voyage"

jobs:
  web:
    name: Test and build web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web bundle (www/)
        run: npm run web:build

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: web-www
          path: www/
          retention-days: 14

      # Runs on pull requests too, so a broken package fails before merge; only uploads on main.
      - name: Package server (src, pages, assets, data, production node_modules)
        run: |
          rm -rf node_modules
          npm ci --omit=dev
          mkdir -p package
          cp -r src assets data database index.html login.html package.json package-lock.json node_modules package/
          cd package
          # The packaged server must load all its modules (a missing one crashes it and Azure answers 503).
          node -e "require('./src/server.js')"
          zip -qr ../podavo-voyage.zip .

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: podavo-voyage
          path: podavo-voyage.zip
          retention-days: 7

  android:
    name: Build Android APK
    needs: web
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: "1.0.${{ github.run_number }}"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      # Public values only (repository variables): the server address and the Google web client id for native sign-in.
      - name: Build web bundle and sync into Android project
        env:
          ONWARD_API_BASE: ${{ vars.ONWARD_API_BASE }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: npm run web:build && npx cap sync android

      # Release signing key from repository secrets (see docs/android-install.md). Without it CI falls back to a debug
      # build: it installs, but every build has a different key, so updating means uninstalling the old app first.
      - name: Set up release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: building a debug APK (updates need an uninstall first)."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/voyage-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/voyage-release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          } > android/keystore.properties
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Assemble APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "${{ steps.signing.outputs.release }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../voyage.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../voyage.apk
          fi
          rm -f keystore.properties
          # The SHA-1 to register on the Android OAuth client in Google Cloud (native Google sign-in checks it).
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs ../voyage.apk 2>/dev/null | grep -i "SHA-1" | head -1 || true

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: voyage.apk
          retention-days: 14

  deploy:
    name: Deploy to Azure (podavo-voyage)
    needs: [web, android]
    # Still deploys the website if the Android build failed; without the APK the install button falls back to the web app install.
    if: always() && needs.web.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC token for azure/login
      contents: read
    concurrency:
      group: deploy-podavo-voyage
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: podavo-voyage

      - uses: actions/download-artifact@v4
        if: needs.android.result == 'success'
        with:
          name: android-apk
          path: download

      - name: Add the Android app to the package (served at /download/voyage.apk)
        if: needs.android.result == 'success'
        run: zip -q podavo-voyage.zip download/voyage.apk

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Make sure the app is running (it is sometimes stopped to save credit)
        run: |
          state=$(az webapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_WEBAPP_NAME" --query state -o tsv)
          echo "App state: $state"
          if [ "$state" != "Running" ]; then az webapp start -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_WEBAPP_NAME"; fi

      - name: Deploy zip
        run: |
          # Async: on B1 Kudu unpacking node_modules can outlast the 230 s gateway limit of a synchronous upload (HTTP 504).
          az webapp deploy -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_WEBAPP_NAME" \
            --src-path podavo-voyage.zip --type zip --async true --track-status false

      - name: Wait for deployment to finish
        timeout-minutes: 20
        run: |
          # Kudu status: 0 pending, 1 building, 2 deploying, 3 failed, 4 success.
          while true; do
            list=$(az webapp log deployment list -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_WEBAPP_NAME" -o json 2>/dev/null || echo '[]')
            d=$(echo "$list" | jq 'if type == "array" then (sort_by(.received_time // .receivedTime // "") | last // {}) else . end')
            status=$(echo "$d" | jq -r '.status // empty')
            echo "$(date -u +%T) status=${status:-?} $(echo "$d" | jq -r '.progress // .status_text // .message // empty' | head -c 120)"
            [ "$status" = "4" ] && exit 0
            [ "$status" = "3" ] && { echo "$d" | jq .; exit 1; }
            sleep 20
          done

      - name: Health check
        run: |
          host=$(az webapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_WEBAPP_NAME" --query defaultHostName -o tsv)
          for i in $(seq 1 20); do
            if curl -fsS "https://${host}/api/health"; then echo; exit 0; fi
            sleep 15
          done
          curl -sS "https://${host}/api/health" || true
          echo "Health check failed"; exit 1
